<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OwnChat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn" class="sidebar-new-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          新对话
        </button>
      </div>
      <div id="conv-list" class="sidebar-list"></div>
      <div class="sidebar-footer">
        <button id="settings-btn" class="sidebar-footer-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          设置
        </button>
        <a href="https://github.com/Yue-Zeyi/OwnChat" id="github-link" class="sidebar-footer-btn" target="_blank" rel="noopener noreferrer" title="GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.835 1.305 3.51 1.005.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
        </a>
      </div>
    </aside>

    <!-- Mobile sidebar backdrop -->
    <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>

    <!-- Main Area -->
    <main id="main">
      <!-- Header -->
      <header id="header">
        <button id="sidebar-toggle" class="header-btn" title="展开/收起侧栏">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
            <line x1="9" y1="3" x2="9" y2="21" />
          </svg>
        </button>
        <div class="header-model">
          <div id="model-dropdown" class="model-dropdown">
            <button id="model-dropdown-btn" class="model-dropdown-btn">
              <span id="current-model">未配置</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </button>
            <div id="model-dropdown-list" class="model-dropdown-list hidden"></div>
          </div>
        </div>
        <div class="header-actions">
          <button id="theme-btn" class="header-btn" type="button" title="切换主题">
            <svg class="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
            <svg class="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Messages -->
      <div id="messages"></div>

      <!-- Welcome Screen (hidden by default, shown via JS when no messages) -->
      <div id="welcome" class="welcome hidden"></div>

      <!-- Input -->
      <div id="input-area">
        <input type="file" id="file-input" class="hidden"
          accept="image/*,.pdf,.txt,.md,.csv,.json,.py,.js,.ts,.html,.css,.xml,.yaml,.yml" multiple title="上传文件">
        <div class="input-wrapper">
          <div id="file-preview" class="file-preview hidden"></div>
          <textarea id="user-input" placeholder="发送消息..." rows="1" maxlength="100000"></textarea>
          <div class="input-toolbar">
            <div class="toolbar-left">
              <button id="attach-btn" class="toolbar-btn" type="button" title="添加文件">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path
                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                </svg>
              </button>
              <button id="conv-settings-btn" class="toolbar-btn" type="button" title="对话设置">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path
                    d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <button id="send-btn" class="send-btn" title="发送">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9" />
              </svg>
            </button>
          </div>
          <div id="conv-settings-panel" class="conv-settings-panel hidden">
            <div class="conv-settings-row">
              <label>对话名称</label>
              <input type="text" id="conv-rename-input" placeholder="当前对话名称" maxlength="50" title="对话名称">
            </div>
            <div class="conv-settings-row">
              <label>Temperature</label>
              <input type="number" id="param-temperature" min="0" max="2" step="0.1" value="0.7" title="Temperature">
              <span class="param-hint">随机性，低=确定，高=创意</span>
            </div>
            <div class="conv-settings-row">
              <label>Top P</label>
              <input type="number" id="param-top-p" min="0" max="1" step="0.1" value="1" title="Top P">
              <span class="param-hint">采样范围，1=全部，越低越聚焦</span>
            </div>
            <div class="conv-settings-row">
              <label>Max Tokens</label>
              <input type="number" id="param-max-tokens" min="1" max="128000" step="1" value="4096" title="Max Tokens">
              <span class="param-hint">回复最大长度</span>
            </div>
          </div>
        </div>
        <div class="input-disclaimer">AI 生成的内容可能不准确。请核实重要信息。</div>
      </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>设置</h2>
          <button id="modal-close" class="modal-close-btn" type="button" title="关闭">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Base URL</label>
            <input type="text" id="cfg-base-url" placeholder="https://api.openai.com/v1" spellcheck="false">
            <div class="field-hint">兼容 OpenAI API 格式的服务地址</div>
          </div>
          <div class="form-group">
            <label>API Key</label>
            <input type="password" id="cfg-api-key" placeholder="sk-..." spellcheck="false" autocomplete="off">
            <div class="field-hint">密钥仅保存在浏览器本地，不会发送到第三方</div>
          </div>
          <div class="form-group">
            <label>模型</label>
            <div class="model-field">
              <select id="cfg-model-select" title="选择模型"></select>
              <button id="cfg-refresh-models" class="btn-refresh" title="刷新模型列表">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="23 4 23 10 17 10" />
                  <path d="M20.49 15a9 9 0 1 1-2.12-8.36L23 10" />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="cfg-save" class="btn-primary" type="button">保存</button>
          <button id="cfg-cancel" class="btn-secondary" type="button">取消</button>
        </div>
      </div>
    </div>

    <!-- Setup Overlay (first-time config) -->
    <div id="setup-overlay">
      <div class="setup-card">
        <div class="setup-logo">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5">
            <path d="M12 2L2 7l10 5 10-5-10-5z" />
            <path d="M2 17l10 5 10-5" />
            <path d="M2 12l10 5 10-5" />
          </svg>
        </div>
        <h1>OwnChat</h1>
        <p class="setup-desc">配置你的 API 连接以开始聊天</p>
        <div class="form-group">
          <label>Base URL</label>
          <input type="text" id="setup-base-url" placeholder="https://api.openai.com/v1" spellcheck="false">
          <div class="field-hint">兼容 OpenAI API 格式的服务地址</div>
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input type="password" id="setup-api-key" placeholder="sk-..." spellcheck="false" autocomplete="off">
          <div class="field-hint">密钥仅保存在浏览器本地</div>
        </div>
        <div class="form-group">
          <label>模型</label>
          <div class="model-field">
            <select id="setup-model-select" title="选择模型"></select>
            <button id="setup-refresh-models" class="btn-refresh" title="获取模型列表">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10" />
                <path d="M20.49 15a9 9 0 1 1-2.12-8.36L23 10" />
              </svg>
            </button>
          </div>
        </div>
        <button id="setup-save" class="btn-primary btn-block">开始聊天</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>

</html>
